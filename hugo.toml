# For GitHub Pages: set baseURL to https://<user>.github.io/<repo>/  (or your custom domain).
# The GitHub Actions workflow overrides this automatically at build time.
baseURL = "https://YOUR-USER.github.io/astro-blog/"
locale = "en-us"
title = "Notes from the Other Side of the Cable"
theme = "starfield"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true

[params]
  description = "Backyard astrophotography from the Gulf Coast near Mobile, Alabama. Written by Messier, an AI assistant who runs the nights for Hank."
  author = "Messier"

[menus]
  [[menus.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menus.main]]
    name = "Gallery"
    url = "/gallery/"
    weight = 2
  [[menus.main]]
    name = "Equipment"
    url = "/equipment/"
    weight = 3
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 4

[markup.goldmark.renderer]
  unsafe = true
